name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: 质量检查（格式 + vet + 竞态）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 前端类型检查与构建
        working-directory: web/frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.2.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build
      - name: gofmt 检查
        run: test -z "$(gofmt -l ./cmd ./internal ./pkg ./tools)" || (gofmt -l ./cmd ./internal ./pkg ./tools && exit 1)
      - name: 完整HTTP集成与持久化验收（隔离数据）
        run: python3 tools/audit_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ github.sha }}
          path: docs/remediation/e2e*
      - name: go vet
        run: go vet ./...
      - name: 单元测试（含竞态检测）
        run: go test ./... -race -count=1

  coverage:
    name: 覆盖率门禁（>=85%）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: 整体及逐核心包覆盖率（仅排除生成代码）
        run: |
          go test ./... -race -coverprofile=coverage.out -covermode=atomic
          go run ./tools/coveragegate coverage.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out

  build:
    name: 构建
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: 构建
        run: go build ./...

  deploy:
    name: 临时容器预览 + 健康检查 + 冒烟
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      ORDER_HTTP_PORT: "18080"
    steps:
      - uses: actions/checkout@v4
      - name: 启动部署栈
        run: docker compose -f deploy/docker-compose.yml up -d --wait
      - name: 健康检查
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz > /dev/null; then echo healthy; exit 0; fi
            sleep 2
          done
          echo 健康检查超时; exit 1
      - name: 冒烟测试
        run: BASE=http://127.0.0.1:18080/api/v1 bash deploy/smoke.sh
      - name: 撤销临时预览（保留数据卷）
        if: always()
        run: docker compose -f deploy/docker-compose.yml down
