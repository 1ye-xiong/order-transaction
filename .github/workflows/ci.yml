name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: 质量检查（格式 + vet + 竞态）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: gofmt 检查
        run: test -z "$(gofmt -l ./cmd ./internal ./pkg ./tools)" || (gofmt -l ./cmd ./internal ./pkg ./tools && exit 1)
      - name: go vet
        run: go vet ./...
      - name: 单元测试（含竞态检测）
        run: go test ./... -race -count=1

  coverage:
    name: 覆盖率门禁（>=85%）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: 整体覆盖率
        run: |
          go test ./... -race -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1
      - name: 核心业务包覆盖率
        run: |
          go test ./internal/order/... ./internal/product/... ./internal/payment/... ./internal/warehouse/... -race -coverprofile=coverage-core.out -covermode=atomic
          total=$(go tool cover -func=coverage-core.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "核心包覆盖率: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 85) { print "覆盖率门禁未达标"; exit 1 } }'

  build:
    name: 构建
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: 构建
        run: go build ./...

  deploy:
    name: 部署 + 健康检查 + 冒烟
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: 启动部署栈
        run: docker compose -f deploy/docker-compose.yml up -d --wait
      - name: 健康检查
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then echo healthy; exit 0; fi
            sleep 2
          done
          echo 健康检查超时; exit 1
      - name: 冒烟测试
        run: bash deploy/smoke.sh
      - name: 回滚方案说明
        run: echo 部署失败或冒烟不通过时执行 docker compose -f deploy/docker-compose.yml down 并回退到上一个通过镜像